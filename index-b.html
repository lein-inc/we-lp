<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>株式会社We LP プレビュー（B案：ヒーロー黒）</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            :root {
                --we-main: #333333;
                --we-sub: #6e6e6e;
                --we-line: #dcdcdc;
                --we-key: #c81e23;
                --we-bg-soft: #f5f5f5;
            }

            .staticrypt-hr {
                display: none;
            }

            .staticrypt-page {
                width: 100%;
                max-width: 400px;
                padding: 0 24px;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: transparent;
                margin: 0 auto;
                padding: 0;
                text-align: left;
                box-shadow: none;
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: transparent;
                border: 0;
                box-sizing: border-box;
                font-size: 14px;
                outline: 0;
                padding: 14px 40px 14px 0;
                width: 100%;
                color: var(--we-main);
                font-family: inherit;
                letter-spacing: 0.06em;
            }

            .staticrypt-form input[type="password"]::placeholder,
            input[type="text"]::placeholder {
                color: var(--we-sub);
                letter-spacing: 0.12em;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: transparent;
                width: 100%;
                border: 0;
                border-bottom: 1px solid var(--we-line);
                margin: 0 0 28px;
                box-sizing: border-box;
                transition: border-color 0.3s ease;
            }

            .staticrypt-password-container:focus-within {
                border-bottom-color: var(--we-key);
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 16px;
                opacity: 50%;
                padding: 12px;
                position: absolute;
                right: -12px;
                top: 50%;
                transform: translateY(-50%);
                width: 16px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #000;
                width: 100%;
                border: 0;
                padding: 14px 16px;
                color: #ffffff;
                font-size: 12px;
                letter-spacing: 0.18em;
                cursor: pointer;
                font-family: inherit;
                transition: opacity 0.3s ease;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #000;
                opacity: 0.78;
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
                background: #ffffff;
                color: var(--we-main);
                font-family: ryo-gothic-plusn, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
                font-size: 12px;
                line-height: 1.8;
                letter-spacing: 0.04em;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 0;
                background: #ffffff;
                font-family: inherit;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-instructions {
                margin: 0 0 40px;
                text-align: left;
                position: relative;
            }

            .staticrypt-title {
                font-size: 15px;
                font-weight: 500;
                color: var(--we-main);
                letter-spacing: 0.08em;
                margin: 0;
                display: flex;
                align-items: center;
            }

            .staticrypt-title::before {
                content: "";
                display: inline-block;
                width: 4px;
                height: 4px;
                background-color: var(--we-key);
                border-radius: 50%;
                margin-right: 0.8em;
                flex: 0 0 4px;
            }

            .staticrypt-instructions p:empty {
                display: none;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 20px;
                font-size: 11px;
                color: var(--we-sub);
                letter-spacing: 0.08em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.1);
                margin-right: 0.8em;
                accent-color: var(--we-key);
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
    </head>
